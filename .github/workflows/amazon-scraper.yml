name: Amazon Seller Scraper

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 12:00 AM UTC = 5:30 AM IST
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  amazon-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # 5. Prepare directories
      - name: Prepare directories
        run: |
          mkdir -p logs
          mkdir -p output
          mkdir -p output/backups
          mkdir -p output/debug

      # 6. Run Amazon scraper
      - name: Run Amazon Seller Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py --batch --headless

      # 7. Upload debug dumps on failure
      - name: Upload debug dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-dumps
          path: |
            output/debug/
            output/*.png
            logs/
          if-no-files-found: ignore
          retention-days: 7

      # 8. Verify output
      - name: Verify output
        if: always()
        run: |
          echo "===== OUTPUT ====="
          find output -maxdepth 2 -type f -print || true

          echo "===== DATABASE ====="
          ls -lh database/amazon_sellers.db 2>/dev/null || ls -lh amazon_sellers.db 2>/dev/null || true

          echo "===== LOGS ====="
          find logs -maxdepth 1 -type f -print || true

      # 9. Upload final artifacts
      - name: Upload scraper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-scraper-results
          path: |
            output/Amazon_Seller_Master_Data.xlsx
            output/backups/
            database/amazon_sellers.db
            amazon_sellers.db
            logs/
          if-no-files-found: warn
          retention-days: 14

      # 10. Commit generated data
      - name: Commit generated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/Amazon_Seller_Master_Data.xlsx
          git add output/backups/
          git add database/amazon_sellers.db 2>/dev/null || true
          git add amazon_sellers.db 2>/dev/null || true
          git add logs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Amazon seller data [skip ci]"
            git push origin HEAD:master
          fi