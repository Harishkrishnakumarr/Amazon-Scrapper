name: Amazon Seller Scraper

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 12:00 AM UTC = 5:30 AM IST
    - cron: "0 0 * * *"

permissions:
  contents: write

# Prevent two scraper runs from modifying master at the same time.
concurrency:
  group: amazon-scraper-master
  cancel-in-progress: false

jobs:
  amazon-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # Do not persist credentials beyond what is needed by git push.
          persist-credentials: true

      # 2. Sync with the latest master BEFORE generating any files.
      - name: Sync with master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git reset --hard origin/master

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Install Playwright Chromium & system libraries
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # 6. Prepare output and log directories
      - name: Prepare directories
        run: |
          mkdir -p logs
          mkdir -p output
          mkdir -p output/backups
          mkdir -p output/debug

      # 7. Run Amazon scraper with amazon_urls.txt
      - name: Run Amazon Seller Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py --batch --urls-file input/amazon_urls.txt --headless --force

      # 8. Upload debug dumps on failure
      - name: Upload debug dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-dumps
          path: |
            output/debug/
            output/*.png
            output/*.html
            logs/
          if-no-files-found: ignore
          retention-days: 7

      # 9. Output audit summary
      - name: Verify output
        if: always()
        run: |
          echo "===== GENERATED FILES ====="
          find output -maxdepth 2 -type f -print || true

          echo "===== DATABASE CHECK ====="
          ls -lh database/amazon_sellers.db* 2>/dev/null || ls -lh amazon_sellers.db* 2>/dev/null || true

          echo "===== LOG CHECK ====="
          find logs -maxdepth 1 -type f -print || true

      # 10. Upload final artifacts
      - name: Upload scraper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-scraper-results
          path: |
            output/Amazon_Seller_Master_Data.xlsx
            output/backups/
            database/amazon_sellers.db*
            amazon_sellers.db*
            logs/
          if-no-files-found: warn
          retention-days: 14

      # 11. Commit generated data back to repository
      - name: Commit generated data
        if: success()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage every generated repository change. This is important because
          # the scraper may update files other than the explicitly listed ones.
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected to commit."
            exit 0
          fi

          git commit -m "Auto-update Amazon seller master data and database [skip ci]"

          # The working tree must be clean before rebase. Because all changes
          # were staged and committed above, pull --rebase can safely run here.
          git fetch origin master
          git rebase origin/master

          # Push the rebased commit to master.
          git push origin HEAD:master
