name: Amazon Seller Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: amazon-scraper-master
  cancel-in-progress: false

jobs:
  amazon-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Sync with master
        if: github.ref_name == 'master'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git reset --hard origin/master
          git clean -fd

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare directories
        run: |
          mkdir -p logs
          mkdir -p output
          mkdir -p output/backups
          mkdir -p output/debug

      - name: Run Amazon Seller Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python main.py --batch --urls-file input/amazon_urls.txt --headless --force 2>&1 | tee logs/batch-run.log

      - name: Normalize batch category statuses
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("logs/batch-run.log")
          if not path.exists():
              raise SystemExit("Batch report normalization failed: log file is missing")

          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          output = []
          i = 0
          converted = 0

          while i < len(lines):
              output.append(lines[i])
              if lines[i].startswith("Status: SUCCESS") and i + 1 < len(lines):
                  match = re.match(r"Sellers:\s*(\d+)\s*$", lines[i + 1].strip())
                  if match and int(match.group(1)) == 0:
                      output[-1] = "Status: NO_DATA"
                      converted += 1
              i += 1

          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Converted {converted} SUCCESS+0-seller category result(s) to NO_DATA")
          PY

      - name: Validate batch quality
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("logs/batch-run.log")
          if not log.exists():
              raise SystemExit("Batch quality gate failed: logs/batch-run.log was not created")

          text = log.read_text(encoding="utf-8", errors="replace")

          def number(pattern, label):
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"Batch quality gate failed: could not find {label} in scraper output")
              return int(match.group(1))

          requested = number(r"Categories requested:\s*(\d+)", "Categories requested")
          processed = number(r"Categories processed:\s*(\d+)", "Categories processed")
          no_data = number(r"Categories no data:\s*(\d+)", "Categories no data")
          skipped = number(r"Categories skipped:\s*(\d+)", "Categories skipped")
          failed = number(r"Categories failed:\s*(\d+)", "Categories failed")
          added = number(r"Total category seller records added:\s*(\d+)", "Total category seller records added")

          attempted = requested - skipped
          failure_rate = (failed / attempted) if attempted else 1.0
          accounted = processed + no_data + skipped + failed

          print("===== BATCH QUALITY =====")
          print(f"requested={requested}")
          print(f"processed={processed}")
          print(f"no_data={no_data}")
          print(f"skipped={skipped}")
          print(f"failed={failed}")
          print(f"seller_records_added={added}")
          print(f"accounted={accounted}")
          print(f"attempted={attempted}")
          print(f"failure_rate={failure_rate:.1%}")

          if requested <= 0:
              raise SystemExit("Batch quality gate failed: no categories were requested")
          if attempted <= 0:
              raise SystemExit("Batch quality gate failed: all categories were skipped")
          if accounted != requested:
              raise SystemExit(
                  f"Batch quality gate failed: category counts do not reconcile "
                  f"({processed}+{no_data}+{skipped}+{failed} != {requested})"
              )
          if added <= 0:
              raise SystemExit("Batch quality gate failed: zero seller records were added")
          if failure_rate > 0.50:
              raise SystemExit(
                  f"Batch quality gate failed: {failed}/{attempted} attempted categories failed ({failure_rate:.1%})"
              )

          print("Batch quality gate PASSED")
          PY

      - name: Upload debug dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-dumps
          path: |
            output/debug/
            output/*.png
            output/*.html
            logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify output
        if: always()
        run: |
          echo "===== GENERATED FILES ====="
          find output -maxdepth 2 -type f -print || true
          echo "===== DATABASE CHECK ====="
          ls -lh database/amazon_sellers.db* 2>/dev/null || ls -lh amazon_sellers.db* 2>/dev/null || true
          echo "===== LOG CHECK ====="
          find logs -maxdepth 1 -type f -print || true

      - name: Upload scraper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-scraper-results
          path: |
            output/Amazon_Seller_Master_Data.xlsx
            output/backups/
            database/amazon_sellers.db*
            amazon_sellers.db*
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated data
        if: success() && github.ref_name == 'master'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "===== GIT STATUS BEFORE COMMIT ====="
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected to commit."
            exit 0
          fi
          git commit -m "Auto-update Amazon seller master data and database [skip ci]"
          echo "===== GIT STATUS AFTER COMMIT ====="
          git status --short
          git push origin HEAD:master
