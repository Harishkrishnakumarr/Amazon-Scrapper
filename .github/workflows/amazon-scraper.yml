name: Amazon Seller Scraper

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 12:00 AM UTC = 5:30 AM IST
    - cron: "0 0 * * *"

permissions:
  contents: write

# Prevent two scraper runs from modifying master at the same time.
concurrency:
  group: amazon-scraper-master
  cancel-in-progress: false

jobs:
  amazon-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      # Always start from the current remote master before generating data.
      - name: Sync with master
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git reset --hard origin/master
          git clean -fd

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare directories
        run: |
          mkdir -p logs
          mkdir -p output
          mkdir -p output/backups
          mkdir -p output/debug

      - name: Run Amazon Seller Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py --batch --urls-file input/amazon_urls.txt --headless --force

      - name: Upload debug dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-dumps
          path: |
            output/debug/
            output/*.png
            output/*.html
            logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify output
        if: always()
        run: |
          echo "===== GENERATED FILES ====="
          find output -maxdepth 2 -type f -print || true
          echo "===== DATABASE CHECK ====="
          ls -lh database/amazon_sellers.db* 2>/dev/null || ls -lh amazon_sellers.db* 2>/dev/null || true
          echo "===== LOG CHECK ====="
          find logs -maxdepth 1 -type f -print || true

      - name: Upload scraper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-scraper-results
          path: |
            output/Amazon_Seller_Master_Data.xlsx
            output/backups/
            database/amazon_sellers.db*
            amazon_sellers.db*
            logs/
          if-no-files-found: warn
          retention-days: 14

      # Commit generated data. Do NOT pull/rebase after the commit.
      # The job was synchronized before the scraper ran, and concurrency
      # prevents another instance of this workflow from changing master.
      - name: Commit generated data
        if: success()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== GIT STATUS BEFORE COMMIT ====="
          git status --short

          # The scraper may change more files than the known output files.
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected to commit."
            exit 0
          fi

          git commit -m "Auto-update Amazon seller master data and database [skip ci]"

          echo "===== GIT STATUS AFTER COMMIT ====="
          git status --short

          # Push directly. No pull/rebase is performed here.
          git push origin HEAD:master
